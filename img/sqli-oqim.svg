<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="SQL Injection qanday ishlaydi" xmlns:c2pa="http://c2pa.org/manifest"><title>SQL Injection qanday ishlaydi</title><defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#23262f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e9e63"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7ddd"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="36" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="bold" text-anchor="middle">SQL Injection: kiritilgan matn so&#x27;rov kodiga aylanadi</text><rect x="30" y="70" width="250" height="110" rx="10" fill="#e7f0fc" stroke="#3b7ddd" stroke-width="2"/><text x="155" y="100" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle">Login forma</text><text x="155" y="135" font-family="Consolas, Courier New, monospace" font-size="14" fill="#e5484d" font-weight="normal" text-anchor="middle">login: admin&#x27; --</text><text x="155" y="158" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="middle">parol: ixtiyoriy</text><rect x="330" y="70" width="540" height="110" rx="10" fill="#d9f2e4" stroke="#1e9e63" stroke-width="2"/><text x="600" y="100" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle">Server kodi (zaif)</text><text x="600" y="134" font-family="Consolas, Courier New, monospace" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle">q = &quot;SELECT * FROM users WHERE login=&#x27;&quot; + login + &quot;&#x27; ...&quot;</text><text x="600" y="158" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="12.5" fill="#5a6270" font-weight="normal" text-anchor="middle">matnlar oddiy qo&#x27;shiladi (konkatenatsiya)</text><line x1="280" y1="125" x2="327" y2="125" stroke="#23262f" stroke-width="2.2" marker-end="url(#ad)"/><rect x="30" y="220" width="840" height="80" rx="8" fill="#fff" stroke="#23262f" stroke-width="2"/><text x="50" y="252" font-family="Consolas, Courier New, monospace" font-size="15.5" fill="#1f2328">SELECT * FROM users WHERE login='admin<tspan fill="#e5484d" font-weight="bold" text-decoration="underline">' --</tspan><tspan fill="#9aa1ab">' AND parol='...'</tspan></text><text x="450" y="285" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="13" fill="#5a6270" font-weight="normal" text-anchor="middle">-- dan keyingi qism izohga aylanadi, parol tekshiruvi o&#x27;chadi</text><line x1="600" y1="180" x2="600" y2="217" stroke="#23262f" stroke-width="2.2" marker-end="url(#ad)"/><rect x="30" y="330" width="400" height="70" rx="10" fill="#fde8e8" stroke="#e5484d" stroke-width="2"/><text x="230.0" y="361.0" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle">Natija: parolsiz kirish</text><text x="230.0" y="382.0" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="12.5" fill="#5a6270" font-weight="normal" text-anchor="middle">Hujumchi admin sifatida tizimga kiradi</text><rect x="470" y="330" width="400" height="70" rx="10" fill="#d9f2e4" stroke="#1e9e63" stroke-width="2"/><text x="670.0" y="361.0" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="16" fill="#1f2328" font-weight="bold" text-anchor="middle">Sabab</text><text x="670.0" y="382.0" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="12.5" fill="#5a6270" font-weight="normal" text-anchor="middle">Ma&#x27;lumot va kod bir qatorda aralashib ketdi</text><line x1="450" y1="300" x2="300" y2="327" stroke="#e5484d" stroke-width="2.2" marker-end="url(#ar)"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>