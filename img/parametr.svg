<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Parametrlangan so&#x27;rov" xmlns:c2pa="http://c2pa.org/manifest"><title>Parametrlangan so&#x27;rov</title><defs><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#23262f"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e9e63"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7ddd"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="34" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="19" fill="#1f2328" font-weight="bold" text-anchor="middle">Konkatenatsiya va parametrlangan so&#x27;rov</text><rect x="20" y="60" width="420" height="300" rx="10" fill="#fde8e8" stroke="#e5484d" stroke-width="2"/><text x="230" y="92" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="17" fill="#e5484d" font-weight="bold" text-anchor="middle">✗ Konkatenatsiya (xavfli)</text><text x="40" y="130" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">sql = &quot;... WHERE id=&quot; + kirish</text><text x="40" y="154" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start"></text><text x="40" y="178" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">kirish = 1 OR 1=1</text><text x="40" y="202" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start"></text><text x="40" y="226" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">SQL dvigateli ko&#x27;radi:</text><text x="40" y="250" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">WHERE id=1 OR 1=1</text><text x="40" y="274" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">→ barcha qatorlar qaytadi!</text><rect x="460" y="60" width="420" height="300" rx="10" fill="#d9f2e4" stroke="#1e9e63" stroke-width="2"/><text x="670" y="92" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="17" fill="#1e9e63" font-weight="bold" text-anchor="middle">✓ Parametr (xavfsiz)</text><text x="480" y="130" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">sql = &quot;... WHERE id = ?&quot;</text><text x="480" y="154" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">cur.execute(sql, (kirish,))</text><text x="480" y="178" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start"></text><text x="480" y="202" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">1) So&#x27;rov shabloni kompilyatsiya</text><text x="480" y="226" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">2) Qiymat alohida yuboriladi</text><text x="480" y="250" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">→ &#x27;1 OR 1=1&#x27; oddiy matn,</text><text x="480" y="274" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">   kod sifatida bajarilmaydi</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>